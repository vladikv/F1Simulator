<div class="track-wrap">
    <svg [attr.viewBox]="track().viewBox" preserveAspectRatio="xMidYMid meet" class="track-svg">
        <path [attr.id]="pathId" [attr.d]="track().fullPathD" fill="none" stroke="none" />

        @for (sector of track().sectors; track sector.name) {
        <path
                [attr.d]="sector.pathD"
                [style.stroke]="sector.colorVar"
                class="sector-accent"
                fill="none"
        />
        }

        <path [attr.d]="track().fullPathD" class="track-line" fill="none" />

        @for (corner of track().corners; track corner.number) {
        <g class="corner-marker" [attr.transform]="'translate(' + corner.x + ',' + corner.y + ')'">
            <circle r="3.5" class="corner-dot" />
            <text class="corner-label" x="10" y="5">{{ corner.number }}</text>
        </g>
        }

        <circle r="4" class="lap-marker">
            <animateMotion [attr.dur]="'7s'" repeatCount="indefinite" rotate="auto">
                <mpath [attr.href]="'#' + pathId" />
            </animateMotion>
        </circle>
    </svg>
</div>
